<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction | Ferrari Addicted</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
        }

        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ff3333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .name {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ffffff, #800000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 1rem;
            color: #b0b0b0;
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .caption {
            font-size: 1.35rem;
            color: #d5d5d5;
            line-height: 1.6;
            margin-bottom: 40px;
            font-style: italic;
            border-left: 3px solid #800000;
            padding-left: 20px;
        }

        .meta-info {
            display: flex;
            gap: 30px;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            color: #666;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meta-value {
            color: #b30000;
            font-weight: 600;
        }

        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-section::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            background: #4a0000;
            z-index: 1;
            transform: rotate(-5deg);
            border-radius: 12px;
            opacity: 0.5;
            filter: blur(20px);
        }

        .profile-img {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            position: relative;
            z-index: 2;
            border: 2px solid #222;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
            }

            .container {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                text-align: center;
            }

            .image-section {
                order: 1; 
                width: 100%;
            }

            .profile-img {
                max-width: 280px;
            }

            .content-section {
                order: 2;
                align-items: center;
            }

            .name {
                font-size: 2.8rem;
            }

            .sub-title {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }

            .caption {
                font-size: 1.15rem;
                border-left: none;
                border-bottom: 2px solid #800000;
                padding-left: 0;
                padding-bottom: 20px;
                max-width: 90%;
            }

            .meta-info {
                justify-content: center;
                gap: 40px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="content-section">
            <div class="badge">Ferrari Addicted</div>
            <h1 class="name">Gehlee Isc.</h1> 
            <div class="sub-title">@gehleeisc</div>
            
            <p class="caption">
                "Deeply interwined with lifelong passion and immense ambition."
            </p>
            
            <div class="meta-info">
                <div class="meta-item">
                    <span class="meta-label">Muse</span>
                    <span class="meta-value">Micaellamn on Instagram</span> 
                </div>
            </div>
        </div>

        <div class="image-section">
            <img src="fotomuse.jpg" alt="Profile Picture" class="profile-img">
        </div>

    </div>

</body>
</html>
